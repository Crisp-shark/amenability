<div id="average-cancellation">
  <div class="viz-controls">
    <label class="form-label" for="cancel-length">区间长度 N：<span id="cancel-n" class="tabular-nums">5</span>
      <input id="cancel-length" class="form-range" type="range" min="4" max="30" value="5">
    </label>
  </div>
  <div id="cancel-drawing"></div>
  <div class="viz-row text-small">
    <span><span class="cancel-key" style="background:var(--viz-series-1)"></span>留下：−f(1)</span>
    <span><span class="cancel-key" style="background:var(--viz-series-2)"></span>留下：+f(N+1)</span>
    <span><span class="cancel-key" style="background:var(--muted-foreground)"></span>相同的项：抵消</span>
  </div>
  <div id="cancel-status" class="viz-row tabular-nums" aria-live="polite"></div>
  <div class="progress" id="cancel-share" role="progressbar" aria-label="未抵消的项数除以区间长度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="40">
    <div class="progress-bar" style="width:40%"></div>
  </div>
</div>
<style>
  #average-cancellation #cancel-drawing {width:100%;margin:12px 0;}
  #average-cancellation .cancel-key {display:inline-block;width:10px;height:10px;margin-right:5px;}
  #average-cancellation #cancel-status {margin:18px 0 8px;}
  #average-cancellation .cancel-svg {display:block;width:100%;}
  #average-cancellation .cancel-svg text {fill:var(--foreground);font-size:12px;font-weight:400;}
</style>
<script>
(() => {
  const root=document.getElementById('average-cancellation');
  const input=root.querySelector('#cancel-length');
  const holder=root.querySelector('#cancel-drawing');
  const ns='http://www.w3.org/2000/svg';
  function draw(){
    const n=Number(input.value),w=holder.getBoundingClientRect().width||640,h=252;
    root.querySelector('#cancel-n').textContent=n;
    const svg=document.createElementNS(ns,'svg');
    svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
    svg.setAttribute('class','cancel-svg');
    svg.setAttribute('role','img');
    svg.setAttribute('aria-label',`区间长度${n}。上排从f(2)到f(${n+1})，减去下排从f(1)到f(${n})；中间${n-1}项抵消，剩下负f(1)和正f(${n+1})。圆点表示函数项的位置，不表示函数值大小。`);
    function el(tag,attrs,text){const e=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));if(text)e.textContent=text;svg.append(e);return e;}
    const left=30,right=w-38,step=(right-left)/n;
    const px=k=>left+(k-1)*step;
    const r=Math.max(3,Math.min(10,step*.23));
    el('text',{x:8,y:18},`平移后的和：f(2) + ⋯ + f(${n+1})`);
    el('text',{x:8,y:125},`减去原来的和：f(1) + ⋯ + f(${n})`);
    for(let k=2;k<=n;k++){
      el('line',{x1:px(k),y1:54+r,x2:px(k),y2:161-r,stroke:'var(--border)','stroke-width':1});
    }
    for(let k=1;k<=n+1;k++){
      for(const [y,present,endpoint,color] of [[54,k>=2,k===n+1,'var(--viz-series-2)'],[161,k<=n,k===1,'var(--viz-series-1)']]){
        if(!present)continue;
        el('circle',{cx:px(k),cy:y,r,fill:endpoint?color:'var(--muted-foreground)',opacity:endpoint?1:.28});
        if(!endpoint){el('line',{x1:px(k)-r,y1:y+r,x2:px(k)+r,y2:y-r,stroke:'var(--muted-foreground)','stroke-width':1.5});}
        if(step>52||endpoint){
          el('text',{x:px(k),y:y+27,'text-anchor':endpoint?(k===1?'start':'end'):'middle'},`f(${k})`);
        }
      }
    }
    el('text',{x:w/2,y:108,'text-anchor':'middle'},`中间 ${n-1} 项：同一项相减`);
    const barY=213,barH=18,total=right-left;
    el('rect',{x:left,y:barY,width:total,height:barH,fill:'var(--muted-foreground)',opacity:.14});
    el('rect',{x:left,y:barY,width:total/n,height:barH,fill:'var(--viz-series-1)'});
    el('rect',{x:right-total/n,y:barY,width:total/n,height:barH,fill:'var(--viz-series-2)'});
    el('text',{x:w/2,y:249,'text-anchor':'middle'},'每个端点在平均中各占 1/N 的权重');
    holder.replaceChildren(svg);
    const pct=200/n;
    root.querySelector('#cancel-status').textContent=`未抵消项数 / 区间长度：2 / ${n} = ${pct.toFixed(1)}%`;
    const progress=root.querySelector('#cancel-share');
    progress.setAttribute('aria-valuenow',pct.toFixed(1));
    progress.firstElementChild.style.width=`${pct}%`;
  }
  input.addEventListener('input',draw);
  new ResizeObserver(draw).observe(holder);
  draw();
})();
</script>
